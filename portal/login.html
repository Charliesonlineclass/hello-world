<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Portal Login - SCORPION AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>.font-inter { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-900 text-gray-100 font-inter min-h-screen flex items-center justify-center">
    <div class="w-full max-w-md px-6">
        <!-- Logo -->
        <div class="text-center mb-8">
            <div class="flex items-center justify-center space-x-2 mb-4">
                <span class="text-4xl">🦂</span>
                <span class="text-2xl font-bold bg-gradient-to-r from-yellow-400 to-cyan-400 bg-clip-text text-transparent">SCORPION</span>
            </div>
            <h1 class="text-xl font-semibold">Client Portal</h1>
            <p class="text-gray-400 text-sm mt-1">Access your AI assistant and projects</p>
        </div>

        <!-- Login Form -->
        <div class="bg-slate-800 rounded-2xl p-8 border border-slate-700">
            <form id="login-form" class="space-y-6">
                <div>
                    <label class="block text-sm font-medium mb-2">Email</label>
                    <input type="email" id="email" required
                        class="w-full bg-slate-900 border border-slate-600 rounded-xl px-4 py-3 focus:outline-none focus:border-cyan-500 transition"
                        placeholder="your@email.com">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-2">Password</label>
                    <input type="password" id="password" required
                        class="w-full bg-slate-900 border border-slate-600 rounded-xl px-4 py-3 focus:outline-none focus:border-cyan-500 transition"
                        placeholder="••••••••">
                </div>
                <div class="flex items-center justify-between text-sm">
                    <label class="flex items-center">
                        <input type="checkbox" class="mr-2 rounded">
                        Remember me
                    </label>
                    <a href="#" class="text-cyan-400 hover:text-cyan-300">Forgot password?</a>
                </div>
                <button type="submit"
                    class="w-full py-4 bg-gradient-to-r from-yellow-500 to-cyan-500 rounded-xl font-semibold hover:opacity-90 transition">
                    Sign In
                </button>
            </form>

            <div id="error-message" class="hidden mt-4 p-4 bg-red-500/20 border border-red-500/50 rounded-xl text-red-400 text-sm"></div>
        </div>

        <!-- Demo Credentials -->
        <div class="mt-6 p-4 bg-slate-800/50 rounded-xl border border-slate-700 text-center text-sm">
            <p class="text-gray-400 mb-2">Demo Credentials:</p>
            <p class="text-gray-300">Email: <span class="text-cyan-400">j3@structural.com</span></p>
            <p class="text-gray-300">Password: <span class="text-cyan-400">demo123</span></p>
        </div>

        <p class="text-center text-gray-500 text-sm mt-6">
            <a href="../website/index.html" class="hover:text-cyan-400 transition">← Back to Website</a>
        </p>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('error-message');

            // Demo authentication
            const demoUsers = {
                'j3@structural.com': { password: 'demo123', id: 1, name: 'J3 Structural Solutions' },
                'contact@ipc.com': { password: 'demo123', id: 2, name: 'IPC Solutions' },
                'antonio@bank.com': { password: 'demo123', id: 3, name: 'Antonio Martinez' }
            };

            if (demoUsers[email] && demoUsers[email].password === password) {
                // Store session
                sessionStorage.setItem('client', JSON.stringify({
                    id: demoUsers[email].id,
                    email: email,
                    name: demoUsers[email].name
                }));
                window.location.href = 'dashboard.html';
            } else {
                errorEl.textContent = 'Invalid email or password. Try demo credentials.';
                errorEl.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
