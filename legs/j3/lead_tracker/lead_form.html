<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scorpion King - Lead Capture Form</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            padding: 20px;
            color: #fff;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2rem;
            color: #f39c12;
            margin-bottom: 10px;
        }

        .header p {
            color: #94a3b8;
            font-size: 0.9rem;
        }

        .form-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 30px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #e2e8f0;
            font-weight: 500;
            font-size: 0.9rem;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            font-size: 1rem;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #f39c12;
            box-shadow: 0 0 0 3px rgba(243, 156, 18, 0.2);
        }

        input::placeholder, textarea::placeholder {
            color: #64748b;
        }

        select option {
            background: #1a1a2e;
            color: #fff;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 500px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .urgency-selector {
            display: flex;
            gap: 10px;
        }

        .urgency-btn {
            flex: 1;
            padding: 12px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.3);
            color: #94a3b8;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }

        .urgency-btn:hover {
            border-color: rgba(243, 156, 18, 0.5);
        }

        .urgency-btn.selected {
            border-color: #f39c12;
            background: rgba(243, 156, 18, 0.2);
            color: #f39c12;
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #f39c12, #e67e22);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(243, 156, 18, 0.3);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .submit-btn:disabled {
            background: #64748b;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .status-message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            display: none;
        }

        .status-message.success {
            display: block;
            background: rgba(16, 185, 129, 0.2);
            border: 1px solid #10b981;
            color: #10b981;
        }

        .status-message.error {
            display: block;
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid #ef4444;
            color: #ef4444;
        }

        .score-preview {
            margin-top: 15px;
            padding: 15px;
            background: rgba(243, 156, 18, 0.1);
            border-radius: 8px;
            border: 1px solid rgba(243, 156, 18, 0.3);
            text-align: center;
        }

        .score-preview .score-value {
            font-size: 2rem;
            font-weight: 700;
            color: #f39c12;
        }

        .score-preview .score-label {
            font-size: 0.8rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>SCORPION KING</h1>
            <p>Lead Capture System</p>
        </div>

        <div class="form-card">
            <form id="leadForm">
                <div class="form-group">
                    <label for="name">Client Name *</label>
                    <input type="text" id="name" name="name" placeholder="Full name or company" required>
                </div>

                <div class="form-group">
                    <label for="contact">Contact Info *</label>
                    <input type="text" id="contact" name="contact" placeholder="Phone or email" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="project_type">Project Type *</label>
                        <select id="project_type" name="project_type" required>
                            <option value="">Select type...</option>
                            <option value="full_build">Full Build</option>
                            <option value="renovation">Renovation</option>
                            <option value="commercial">Commercial</option>
                            <option value="residential">Residential</option>
                            <option value="repair">Repair</option>
                            <option value="consultation">Consultation</option>
                            <option value="other">Other</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="source">Lead Source *</label>
                        <select id="source" name="source" required>
                            <option value="">Select source...</option>
                            <option value="website">Website</option>
                            <option value="referral">Referral</option>
                            <option value="social_media">Social Media</option>
                            <option value="google">Google</option>
                            <option value="cold_call">Cold Call</option>
                            <option value="walk_in">Walk-in</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>Urgency Level *</label>
                    <div class="urgency-selector">
                        <button type="button" class="urgency-btn" data-value="1">1</button>
                        <button type="button" class="urgency-btn" data-value="2">2</button>
                        <button type="button" class="urgency-btn selected" data-value="3">3</button>
                        <button type="button" class="urgency-btn" data-value="4">4</button>
                        <button type="button" class="urgency-btn" data-value="5">5</button>
                    </div>
                    <input type="hidden" id="urgency" name="urgency" value="3">
                </div>

                <div class="form-group">
                    <label for="budget">Estimated Budget ($) *</label>
                    <input type="number" id="budget" name="budget" placeholder="25000" min="0" step="1000" required>
                </div>

                <div class="form-group">
                    <label for="notes">Notes</label>
                    <textarea id="notes" name="notes" placeholder="Additional details about the project..."></textarea>
                </div>

                <div class="score-preview" id="scorePreview" style="display: none;">
                    <div class="score-label">Estimated Lead Score</div>
                    <div class="score-value" id="scoreValue">--</div>
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">
                    Submit Lead
                </button>

                <div class="status-message" id="statusMessage"></div>
            </form>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:9999';

        // Urgency selector
        const urgencyBtns = document.querySelectorAll('.urgency-btn');
        const urgencyInput = document.getElementById('urgency');

        urgencyBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                urgencyBtns.forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                urgencyInput.value = btn.dataset.value;
                updateScorePreview();
            });
        });

        // Score preview calculation
        function calculateScore(urgency, budget, projectType) {
            const urgencyScore = urgency * 6;

            let budgetScore;
            if (budget >= 100000) budgetScore = 40;
            else if (budget >= 50000) budgetScore = 30;
            else if (budget >= 25000) budgetScore = 20;
            else if (budget >= 10000) budgetScore = 10;
            else budgetScore = 5;

            const projectScores = {
                'full_build': 30,
                'renovation': 25,
                'commercial': 28,
                'residential': 22,
                'repair': 15,
                'consultation': 10,
                'other': 12
            };
            const projectScore = projectScores[projectType] || 12;

            return Math.min(100, urgencyScore + budgetScore + projectScore);
        }

        function updateScorePreview() {
            const urgency = parseInt(urgencyInput.value);
            const budget = parseFloat(document.getElementById('budget').value) || 0;
            const projectType = document.getElementById('project_type').value;

            if (budget > 0 && projectType) {
                const score = calculateScore(urgency, budget, projectType);
                document.getElementById('scoreValue').textContent = score;
                document.getElementById('scorePreview').style.display = 'block';
            }
        }

        document.getElementById('budget').addEventListener('input', updateScorePreview);
        document.getElementById('project_type').addEventListener('change', updateScorePreview);

        // Form submission
        document.getElementById('leadForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const submitBtn = document.getElementById('submitBtn');
            const statusMessage = document.getElementById('statusMessage');

            submitBtn.disabled = true;
            submitBtn.textContent = 'Submitting...';
            statusMessage.className = 'status-message';
            statusMessage.style.display = 'none';

            const formData = {
                name: document.getElementById('name').value.trim(),
                contact: document.getElementById('contact').value.trim(),
                project_type: document.getElementById('project_type').value,
                source: document.getElementById('source').value,
                urgency: parseInt(urgencyInput.value),
                budget: parseFloat(document.getElementById('budget').value),
                notes: document.getElementById('notes').value.trim(),
                status: 'new'
            };

            try {
                const response = await fetch(`${API_URL}/leads`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const result = await response.json();

                statusMessage.className = 'status-message success';
                statusMessage.textContent = `Lead submitted successfully! Score: ${result.score} | ID: ${result.id}`;
                statusMessage.style.display = 'block';

                // Reset form
                document.getElementById('leadForm').reset();
                urgencyBtns.forEach(b => b.classList.remove('selected'));
                urgencyBtns[2].classList.add('selected'); // Reset to 3
                urgencyInput.value = 3;
                document.getElementById('scorePreview').style.display = 'none';

            } catch (error) {
                console.error('Error:', error);
                statusMessage.className = 'status-message error';
                statusMessage.textContent = `Error: ${error.message}. Is the CRM API running on port 9999?`;
                statusMessage.style.display = 'block';
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Submit Lead';
            }
        });
    </script>
</body>
</html>
