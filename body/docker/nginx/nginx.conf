# =============================================================================
# SCORPION - Nginx Main Configuration
# =============================================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/rss+xml application/atom+xml image/svg+xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Upstream servers
    upstream scorpion_api {
        server scorpion-brain:8080;
        keepalive 32;
    }

    upstream scorpion_bridge {
        server scorpion-brain:9876;
        keepalive 16;
    }

    upstream n8n_server {
        server scorpion-n8n:5678;
        keepalive 16;
    }

    upstream chromadb_server {
        server scorpion-chromadb:8000;
        keepalive 16;
    }

    # Main server
    server {
        listen 80;
        server_name localhost scorpion.local;

        # Health check endpoint
        location /health {
            access_log off;
            return 200 '{"status":"healthy","server":"nginx"}';
            add_header Content-Type application/json;
        }

        # SCORPION API
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://scorpion_api/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 120s;
        }

        # Bridge API
        location /bridge/ {
            proxy_pass http://scorpion_bridge/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 120s;
        }

        # n8n Workflows
        location /n8n/ {
            proxy_pass http://n8n_server/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ChromaDB (internal only in production)
        location /chromadb/ {
            # Restrict to internal network
            allow 172.28.0.0/16;
            deny all;

            proxy_pass http://chromadb_server/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Default - serve static or redirect to API
        location / {
            try_files $uri $uri/ @api;
        }

        location @api {
            proxy_pass http://scorpion_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
