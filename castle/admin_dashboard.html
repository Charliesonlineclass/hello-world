<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scorpion King - Admin Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #fff;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .header h1 {
            color: #f39c12;
            font-size: 1.8rem;
        }

        .header h1 span {
            color: #94a3b8;
            font-size: 0.9rem;
            font-weight: normal;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #f39c12, #e67e22);
            color: #fff;
        }

        .btn-secondary {
            background: rgba(59, 130, 246, 0.2);
            color: #3b82f6;
            border: 1px solid #3b82f6;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 25px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .stat-card .value {
            font-size: 2.5rem;
            font-weight: 700;
            color: #f39c12;
        }

        .stat-card .label {
            font-size: 0.85rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 5px;
        }

        .stat-card.success .value { color: #10b981; }
        .stat-card.info .value { color: #3b82f6; }
        .stat-card.warning .value { color: #f59e0b; }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .tab {
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #94a3b8;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .tab.active {
            background: rgba(243, 156, 18, 0.2);
            border-color: #f39c12;
            color: #f39c12;
        }

        /* Panels */
        .panel {
            display: none;
        }

        .panel.active {
            display: block;
        }

        /* Table */
        .table-container {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
        }

        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: rgba(0, 0, 0, 0.2);
            flex-wrap: wrap;
            gap: 10px;
        }

        .table-header h3 {
            color: #e2e8f0;
        }

        .filter-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-select {
            padding: 8px 15px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            color: #fff;
            font-size: 0.9rem;
        }

        .filter-select option {
            background: #1a1a2e;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        th {
            background: rgba(0, 0, 0, 0.2);
            color: #94a3b8;
            font-weight: 600;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        tr:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        .score-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.85rem;
            background: linear-gradient(135deg, #f39c12, #e67e22);
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-new { background: rgba(59, 130, 246, 0.2); color: #3b82f6; }
        .status-contacted { background: rgba(139, 92, 246, 0.2); color: #8b5cf6; }
        .status-qualified { background: rgba(236, 72, 153, 0.2); color: #ec4899; }
        .status-proposal { background: rgba(245, 158, 11, 0.2); color: #f59e0b; }
        .status-negotiation { background: rgba(249, 115, 22, 0.2); color: #f97316; }
        .status-won { background: rgba(16, 185, 129, 0.2); color: #10b981; }
        .status-lost { background: rgba(239, 68, 68, 0.2); color: #ef4444; }

        .agent-select {
            padding: 6px 12px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            color: #fff;
            font-size: 0.85rem;
            min-width: 120px;
        }

        .agent-select option {
            background: #1a1a2e;
        }

        /* Agents Grid */
        .agents-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .agent-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 25px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .agent-card h3 {
            color: #f39c12;
            margin-bottom: 15px;
            font-size: 1.3rem;
        }

        .agent-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .agent-stat {
            text-align: center;
            padding: 15px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
        }

        .agent-stat .value {
            font-size: 1.5rem;
            font-weight: 700;
            color: #fff;
        }

        .agent-stat .label {
            font-size: 0.75rem;
            color: #64748b;
            text-transform: uppercase;
        }

        /* Pipeline View */
        .pipeline-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .pipeline-column {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .pipeline-column h4 {
            text-align: center;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 8px;
            font-size: 0.85rem;
            text-transform: uppercase;
        }

        .pipeline-column.new h4 { background: rgba(59, 130, 246, 0.2); color: #3b82f6; }
        .pipeline-column.contacted h4 { background: rgba(139, 92, 246, 0.2); color: #8b5cf6; }
        .pipeline-column.qualified h4 { background: rgba(236, 72, 153, 0.2); color: #ec4899; }
        .pipeline-column.proposal h4 { background: rgba(245, 158, 11, 0.2); color: #f59e0b; }
        .pipeline-column.negotiation h4 { background: rgba(249, 115, 22, 0.2); color: #f97316; }
        .pipeline-column.won h4 { background: rgba(16, 185, 129, 0.2); color: #10b981; }
        .pipeline-column.lost h4 { background: rgba(239, 68, 68, 0.2); color: #ef4444; }

        .pipeline-count {
            text-align: center;
            font-size: 2rem;
            font-weight: 700;
            color: #fff;
        }

        .pipeline-value {
            text-align: center;
            font-size: 0.85rem;
            color: #64748b;
            margin-top: 5px;
        }

        /* Responsive */
        .table-responsive {
            overflow-x: auto;
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                text-align: center;
            }

            th, td {
                padding: 10px;
                font-size: 0.85rem;
            }

            .hide-mobile {
                display: none;
            }
        }

        /* Loading & Empty */
        .loading, .empty {
            text-align: center;
            padding: 40px;
            color: #64748b;
        }

        /* Add Agent Form */
        .add-agent-form {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .add-agent-form input {
            flex: 1;
            min-width: 200px;
            padding: 12px 15px;
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
        }

        .add-agent-form input::placeholder {
            color: #64748b;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>SCORPION KING <span>Admin Dashboard</span></h1>
            <div class="header-actions">
                <button class="btn btn-secondary" onclick="refreshAll()">Refresh</button>
                <button class="btn btn-primary" onclick="window.open('agent_dashboard.html')">Agent View</button>
            </div>
        </div>

        <!-- Stats -->
        <div class="stats-grid" id="statsGrid">
            <div class="stat-card">
                <div class="value" id="totalLeads">0</div>
                <div class="label">Total Leads</div>
            </div>
            <div class="stat-card success">
                <div class="value" id="wonDeals">0</div>
                <div class="label">Won Deals</div>
            </div>
            <div class="stat-card info">
                <div class="value" id="conversionRate">0%</div>
                <div class="label">Conversion Rate</div>
            </div>
            <div class="stat-card warning">
                <div class="value" id="totalValue">$0</div>
                <div class="label">Total Value Won</div>
            </div>
        </div>

        <!-- Pipeline Overview -->
        <div class="pipeline-grid" id="pipelineGrid"></div>

        <!-- Tabs -->
        <div class="tabs">
            <div class="tab active" data-tab="leads">All Leads</div>
            <div class="tab" data-tab="agents">Agents</div>
        </div>

        <!-- Leads Panel -->
        <div class="panel active" id="leadsPanel">
            <div class="table-container">
                <div class="table-header">
                    <h3>Lead Management</h3>
                    <div class="filter-group">
                        <select class="filter-select" id="filterStatus" onchange="filterLeads()">
                            <option value="">All Status</option>
                            <option value="new">New</option>
                            <option value="contacted">Contacted</option>
                            <option value="qualified">Qualified</option>
                            <option value="proposal">Proposal</option>
                            <option value="negotiation">Negotiation</option>
                            <option value="won">Won</option>
                            <option value="lost">Lost</option>
                        </select>
                        <select class="filter-select" id="filterAgent" onchange="filterLeads()">
                            <option value="">All Agents</option>
                        </select>
                    </div>
                </div>
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>Score</th>
                                <th>Name</th>
                                <th>Contact</th>
                                <th class="hide-mobile">Project</th>
                                <th>Budget</th>
                                <th>Status</th>
                                <th>Assigned To</th>
                            </tr>
                        </thead>
                        <tbody id="leadsTable">
                            <tr><td colspan="7" class="loading">Loading leads...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Agents Panel -->
        <div class="panel" id="agentsPanel">
            <div class="add-agent-form">
                <input type="text" id="newAgentName" placeholder="Enter new agent name...">
                <button class="btn btn-primary" onclick="addAgent()">Add Agent</button>
            </div>
            <div class="agents-grid" id="agentsGrid">
                <div class="loading">Loading agents...</div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:9999';
        let allLeads = [];
        let allAgents = [];

        // Tab switching
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById(tab.dataset.tab + 'Panel').classList.add('active');
            });
        });

        // Load everything
        async function refreshAll() {
            await Promise.all([loadPipeline(), loadAgents(), loadLeads()]);
        }

        // Load pipeline data
        async function loadPipeline() {
            try {
                const response = await fetch(`${API_URL}/pipeline`);
                const data = await response.json();

                // Update stats
                document.getElementById('totalLeads').textContent = data.stats.total_leads;
                document.getElementById('wonDeals').textContent = data.stats.won_deals;
                document.getElementById('conversionRate').textContent = data.stats.conversion_rate + '%';
                document.getElementById('totalValue').textContent = '$' + data.stats.total_value_won.toLocaleString();

                // Update pipeline grid
                const statuses = ['new', 'contacted', 'qualified', 'proposal', 'negotiation', 'won', 'lost'];
                const statusLabels = {
                    new: 'New', contacted: 'Contacted', qualified: 'Qualified',
                    proposal: 'Proposal', negotiation: 'Negotiation', won: 'Won', lost: 'Lost'
                };

                document.getElementById('pipelineGrid').innerHTML = statuses.map(status => {
                    const leads = data.pipeline[status];
                    const value = leads.reduce((sum, l) => sum + l.budget, 0);
                    return `
                        <div class="pipeline-column ${status}">
                            <h4>${statusLabels[status]}</h4>
                            <div class="pipeline-count">${leads.length}</div>
                            <div class="pipeline-value">$${value.toLocaleString()}</div>
                        </div>
                    `;
                }).join('');

            } catch (error) {
                console.error('Error loading pipeline:', error);
            }
        }

        // Load agents
        async function loadAgents() {
            try {
                const response = await fetch(`${API_URL}/agents`);
                allAgents = await response.json();

                // Update filter dropdown
                const filterAgent = document.getElementById('filterAgent');
                filterAgent.innerHTML = '<option value="">All Agents</option>';
                allAgents.forEach(agent => {
                    filterAgent.innerHTML += `<option value="${agent.name}">${agent.name}</option>`;
                });

                // Update agents grid
                document.getElementById('agentsGrid').innerHTML = allAgents.map(agent => `
                    <div class="agent-card">
                        <h3>${escapeHtml(agent.name)}</h3>
                        <div class="agent-stats">
                            <div class="agent-stat">
                                <div class="value">${agent.lead_count}</div>
                                <div class="label">Leads</div>
                            </div>
                            <div class="agent-stat">
                                <div class="value">${agent.conversion_rate}%</div>
                                <div class="label">Conversion</div>
                            </div>
                        </div>
                    </div>
                `).join('');

            } catch (error) {
                console.error('Error loading agents:', error);
                document.getElementById('agentsGrid').innerHTML = '<div class="empty">Error loading agents</div>';
            }
        }

        // Load leads
        async function loadLeads() {
            try {
                const response = await fetch(`${API_URL}/leads`);
                allLeads = await response.json();
                renderLeads(allLeads);
            } catch (error) {
                console.error('Error loading leads:', error);
                document.getElementById('leadsTable').innerHTML = '<tr><td colspan="7" class="empty">Error loading leads</td></tr>';
            }
        }

        // Render leads table
        function renderLeads(leads) {
            if (leads.length === 0) {
                document.getElementById('leadsTable').innerHTML = '<tr><td colspan="7" class="empty">No leads found</td></tr>';
                return;
            }

            document.getElementById('leadsTable').innerHTML = leads.map(lead => `
                <tr>
                    <td><span class="score-badge">${lead.score}</span></td>
                    <td><strong>${escapeHtml(lead.name)}</strong></td>
                    <td>${escapeHtml(lead.contact)}</td>
                    <td class="hide-mobile">${formatProjectType(lead.project_type)}</td>
                    <td>$${lead.budget.toLocaleString()}</td>
                    <td><span class="status-badge status-${lead.status}">${lead.status}</span></td>
                    <td>
                        <select class="agent-select" onchange="assignAgent(${lead.id}, this.value)">
                            <option value="">Unassigned</option>
                            ${allAgents.map(a => `
                                <option value="${a.name}" ${lead.assigned_agent === a.name ? 'selected' : ''}>
                                    ${a.name}
                                </option>
                            `).join('')}
                        </select>
                    </td>
                </tr>
            `).join('');
        }

        // Filter leads
        function filterLeads() {
            const status = document.getElementById('filterStatus').value;
            const agent = document.getElementById('filterAgent').value;

            let filtered = allLeads;

            if (status) {
                filtered = filtered.filter(l => l.status === status);
            }

            if (agent) {
                filtered = filtered.filter(l => l.assigned_agent === agent);
            }

            renderLeads(filtered);
        }

        // Assign agent to lead
        async function assignAgent(leadId, agentName) {
            try {
                await fetch(`${API_URL}/leads/${leadId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ assigned_agent: agentName || null })
                });

                // Update local data
                const lead = allLeads.find(l => l.id === leadId);
                if (lead) lead.assigned_agent = agentName;

                // Refresh agents to update counts
                loadAgents();

            } catch (error) {
                console.error('Error assigning agent:', error);
                alert('Error assigning agent');
            }
        }

        // Add new agent
        async function addAgent() {
            const name = document.getElementById('newAgentName').value.trim();
            if (!name) {
                alert('Please enter agent name');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/agents?name=${encodeURIComponent(name)}`, {
                    method: 'POST'
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail);
                }

                document.getElementById('newAgentName').value = '';
                loadAgents();
                loadLeads(); // Refresh to update dropdowns

            } catch (error) {
                console.error('Error adding agent:', error);
                alert('Error: ' + error.message);
            }
        }

        // Helpers
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatProjectType(type) {
            const types = {
                'full_build': 'Full Build',
                'renovation': 'Renovation',
                'commercial': 'Commercial',
                'residential': 'Residential',
                'repair': 'Repair',
                'consultation': 'Consultation',
                'other': 'Other'
            };
            return types[type] || type;
        }

        // Init
        document.addEventListener('DOMContentLoaded', refreshAll);
    </script>
</body>
</html>
